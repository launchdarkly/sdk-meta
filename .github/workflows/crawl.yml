name: Crawl Repos
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
env:
  DB_NAME: metadata.sqlite3
  METADATA_DIR: metadata
  SQLITE_TOOLS_URL: https://sqlite.org/2026/sqlite-tools-linux-x64-3530400.zip
  SQLITE_TOOLS_SHA256: 7a6f4d1720e4bc13faa3d934bfce37b816a496c0a2480deacd64cfd8be6cf224
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
            go-version-file: tool/go.mod
            cache-dependency-path: tool/go.sum
      - name: Cache sqldiff
        id: sqldiff
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/sqldiff
          key: sqldiff-${{ runner.os }}-${{ env.SQLITE_TOOLS_SHA256 }}
      - name: Install sqldiff
        if: steps.sqldiff.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/sqlite-tools.zip "$SQLITE_TOOLS_URL"
          echo "$SQLITE_TOOLS_SHA256  /tmp/sqlite-tools.zip" | sha256sum -c -
          unzip -oj /tmp/sqlite-tools.zip sqldiff -d ~/.local/bin
      - name: Put sqldiff on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Crawl repos
        id: crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/crawl.sh ${{ env.DB_NAME }}.new ${{ env.METADATA_DIR }}.new
      - name: Diff against previous crawl
        id: diff
        run: |
          changes=$(sqldiff --primarykey ${{ env.DB_NAME }} ${{ env.DB_NAME }}.new)
          if [ -z "$changes" ]; then
            echo "No changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$changes"
            { echo 'changes<<END'; echo "$changes"; echo 'END'; } >> $GITHUB_OUTPUT
          fi

      - name: Update data
        id: update
        if: steps.diff.outputs.changed == 'true'
        run: |
          mv ${{ env.DB_NAME }}.new ${{ env.DB_NAME }}
          rm -rf ${{ env.METADATA_DIR }}
          mv ${{ env.METADATA_DIR }}.new ${{ env.METADATA_DIR }}
      - name: Generate products
        id: generate
        if: steps.update.outcome == 'success'
        run: |
          ./scripts/generate-products.sh
      - name: Create PR
        if: steps.generate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: metadata-update
          TITLE: "fix(metadata): ingest new data and regenerate products"
          CHANGES: ${{ steps.diff.outputs.changes }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -- "$DB_NAME" "$METADATA_DIR" products api/sdkmeta/data api-js/src/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$TITLE"

          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Branch $BRANCH is already up to date."
          else
            git push --force origin "HEAD:refs/heads/$BRANCH"
          fi

          {
            echo 'Metadata has changed. Ensure that the changes obey patch semantics (data added or modified in a non-breaking'
            echo 'way), as upstream services may consume these changes automatically.'
            echo '```'
            printf '%s\n' "$CHANGES"
            echo '```'
          } > pr-body.md
          # GitHub rejects PR bodies over 65536 characters.
          if [ "$(wc -c < pr-body.md)" -gt 60000 ]; then
            { head -c 60000 pr-body.md; printf '\n```\n\n_Diff truncated; see the workflow run log for the full output._\n'; } > pr-body.trunc.md
            mv pr-body.trunc.md pr-body.md
          fi

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$TITLE" --body-file pr-body.md
          else
            gh pr create --head "$BRANCH" --base main --title "$TITLE" --body-file pr-body.md
          fi
