name: Crawl Repos
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
env:
  DB_NAME: metadata.sqlite3
  METADATA_DIR: metadata
  SQLITE_TOOLS_URL: https://sqlite.org/2026/sqlite-tools-linux-x64-3530400.zip
  SQLITE_TOOLS_SHA256: 7a6f4d1720e4bc13faa3d934bfce37b816a496c0a2480deacd64cfd8be6cf224
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
            go-version: 1.22
            cache-dependency-path: tool/go.sum
      - name: Cache sqldiff
        id: sqldiff
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/sqldiff
          key: sqldiff-${{ runner.os }}-${{ env.SQLITE_TOOLS_SHA256 }}
      - name: Install sqldiff
        if: steps.sqldiff.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/sqlite-tools.zip "$SQLITE_TOOLS_URL"
          echo "$SQLITE_TOOLS_SHA256  /tmp/sqlite-tools.zip" | sha256sum -c -
          unzip -oj /tmp/sqlite-tools.zip sqldiff -d ~/.local/bin
      - name: Put sqldiff on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Crawl repos
        id: crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/crawl.sh ${{ env.DB_NAME }}.new ${{ env.METADATA_DIR }}.new
      - name: Diff against previous crawl
        id: diff
        run: |
          changes=$(sqldiff --primarykey ${{ env.DB_NAME }} ${{ env.DB_NAME }}.new)
          if [ -z "$changes" ]; then
            echo "No changes detected."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$changes"
            { echo 'changes<<END'; echo "$changes"; echo 'END'; } >> $GITHUB_OUTPUT
          fi

      - name: Update data
        id: update
        if: steps.diff.outputs.changed == 'true'
        run: |
          mv ${{ env.DB_NAME }}.new ${{ env.DB_NAME }}
          rm -rf ${{ env.METADATA_DIR }}
          mv ${{ env.METADATA_DIR }}.new ${{ env.METADATA_DIR }}
      - name: Generate products
        id: generate
        if: steps.update.outcome == 'success'
        run: |
          ./scripts/generate-products.sh
      - name: Create PR
        if: steps.generate.outcome == 'success'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            ${{ env.DB_NAME }}
            ${{ env.METADATA_DIR }}
            products
            api/sdkmeta/data
            api-js/src/data
          branch: "metadata-update"
          title: "fix(metadata): ingest new data and regenerate products"
          commit-message: "fix(metadata): ingest new data and regenerate products"
          body: |
            Metadata has changed. Ensure that the changes obey patch semantics (data added or modified in a non-breaking
            way), as upstream services may consume these changes automatically. 
            ```
            ${{ steps.diff.outputs.changes }}
            ``` 
